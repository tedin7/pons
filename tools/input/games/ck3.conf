# Game profile, read by pinguplay-game (inside Linux) and tools/dev/pp-bench.sh (host).
# Plain KEY=value lines, sourced by sh: keep values quoted, no commands.
NAME="Crusader Kings III"
# Steam signs the game in: the client must be logged on before it starts.
STEAM_APPID="1158310"
# Folder under ~/.local/share/Steam/steamapps/common and the program inside it.
DIR="Crusader Kings III/binaries"
EXEC="./ck3"
ARGS="-gdpr-compliant"
# A strategy game needs no more; above this the tablet only gets hotter.
MAX_FPS="30"

# Benchmarks: where the game logs, under the Linux home, and the line meaning "ready".
LOG="~/.local/share/Paradox Interactive/Crusader Kings III/logs/debug.log"
READY="Setting idler 'In Game'"
# Same start every run: the game autosaves, and -continuelastsave loads the newest.
PREPARE="cd ~/'.local/share/Paradox Interactive/Crusader Kings III' && cp 'save games/Duke_Vratislav_II_of_Bohemia_1066_09_15.ck3' last_save.ck3"
# Scenes: extra game arguments | keys sent once ready (xdotool; type:word types text).
SCENE_map="-continuelastsave|"
SCENE_heavy="-continuelastsave -debug_mode|grave type:observe Return grave space 5"
